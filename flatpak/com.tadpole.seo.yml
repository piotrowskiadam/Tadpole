# AI-assisted upstream build for GitHub distribution only.
# This is not a Flathub submission manifest. Flathub requires its manifest to be human-authored.
id: com.tadpole.seo
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: tadpole
finish-args:
  - --share=ipc
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
modules:
  - name: tadpole
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/rust-stable/bin
      env:
        CARGO_NET_OFFLINE: 'true'
    build-commands:
      - cargo build --release --locked --offline
      - install -Dm755 target/release/tadpole /app/bin/tadpole
      - install -Dm644 snap/gui/com.tadpole.seo.desktop /app/share/applications/com.tadpole.seo.desktop
      - cc flatpak/scale-icon.c -o /tmp/tadpole-scale-icon $(pkg-config --cflags --libs gdk-pixbuf-2.0)
      - install -d /app/share/icons/hicolor/512x512/apps
      - /tmp/tadpole-scale-icon tadpolelogonobg.png /app/share/icons/hicolor/512x512/apps/com.tadpole.seo.png
      - install -Dm644 flatpak/com.tadpole.seo.metainfo.xml /app/share/metainfo/com.tadpole.seo.metainfo.xml
      - install -Dm644 LICENSE /app/share/licenses/com.tadpole.seo/LICENSE
    sources:
      - type: dir
        path: ..
